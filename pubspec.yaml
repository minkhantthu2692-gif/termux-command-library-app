name: termux_command_library
description: "A community-driven, offline-first library for Termux commands and multi-step command guides."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management and navigation
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1

  # Offline-first database
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  path: ^1.9.1
  path_provider: ^2.1.6

  # Firebase: Authentication and Firestore only (no Storage by design)
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0

  # Services
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  file_picker: ^13.3.0
  url_launcher: ^6.3.3

  # Utilities
  intl: ^0.20.3
  crypto: ^3.0.8
  uuid: ^4.6.0
  flutter_markdown_plus: ^1.0.12
  google_sign_in: ^7.2.0
  dynamic_color: ^2.1.0
  material_color_utilities: ^0.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1
  dynamic_color_testing: ^1.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/brand/
    - assets/data/
    - assets/docs/
    - assets/fonts/licenses/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Variable.ttf
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Variable.ttf
    - family: NunitoSans
      fonts:
        - asset: assets/fonts/NunitoSans-Variable.ttf
    - family: SourceSans3
      fonts:
        - asset: assets/fonts/SourceSans3-Variable.ttf
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Variable.ttf
    - family: RobotoSlab
      fonts:
        - asset: assets/fonts/RobotoSlab-Variable.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
    - family: NotoSansMyanmar
      fonts:
        - asset: assets/fonts/NotoSansMyanmar-Variable.ttf
